name: Middleware tests

on:
  push:
    paths:
      - 'Middleware/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'Middleware/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r Middleware/requirements.txt
      - name: Run isolated middleware tests
        run: python -m pytest Middleware/tests -q -p no:cacheprovider
