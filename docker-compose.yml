version: "3.8"

services:
  middleware:
    build:
      context: ./Middleware
      dockerfile: Dockerfile
    ports:
      - "${MIDDLEWARE_PORT:-8000}:8080"
    env_file:
      - ./Middleware/.env
    environment:
      - MIDDLEWARE_HOST=0.0.0.0
      - MIDDLEWARE_PORT=8080
      - SQLITE_DB_PATH=/app/data/kanban.db
    volumes:
      - middleware_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  middleware_data:
